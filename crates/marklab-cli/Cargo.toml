[package]
name = "marklab-cli"
version = "0.2.8"
description = "Standalone, local Markdown export and publishing CLI"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lyonbrown4d/marklab"
homepage = "https://lyonbrown4d.github.io/marklab/"
readme = "README.md"
keywords = ["markdown", "cli", "pdf", "epub", "documents"]
categories = ["command-line-utilities", "text-processing"]
publish = ["crates-io"]
include = ["src/**", "tests/**", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[[bin]]
name = "marklab"
path = "src/main.rs"

[dependencies]
marklab-document = { path = "../marklab-document", version = "=0.2.8" }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
indicatif = "0.18.6"
globset = "0.4.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "1.1.8"
tempfile = "3.27.0"
pulldown-cmark = "0.13.5"
percent-encoding = "2"
pathdiff = "0.2"
tokio = { version = "1.54.1", features = ["macros", "rt", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
