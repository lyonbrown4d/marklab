[package]
name = "marklab_search_native"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.24"
unicode-normalization = "0.1"

[build-dependencies]
napi-build = "2"
