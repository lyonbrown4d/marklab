tasks:
  bindings-generate:
    command: pnpm bindings:generate
    inputs: []
    options:
      cache: false
  typecheck:
    deps:
      - ~:bindings-generate
    command: node node_modules/typescript/bin/tsc6 -b
    inputs:
      - src-tauri/src/**/*.rs
      - src-tauri/Cargo.toml
      - Cargo.toml
      - crates/**/*
      - Cargo.lock
      - tsconfig*.json
      - src/**/*
      - scripts/**/*
      - '*.ts'
      - package.json
      - pnpm-lock.yaml
    options:
      cache: true
  test:
    command: pnpm test:coverage:critical
    inputs:
      - src/**/*
      - vite.config.ts
      - package.json
      - pnpm-lock.yaml
    options:
      cache: false
  test-ui:
    command: pnpm test:tauri:e2e
    options:
      cache: false
  test-performance-software:
    command: pnpm test:perf:software
    inputs:
      - e2e/performance/**/*
      - src/**/*
      - playwright.renderer.config.ts
      - e2e/renderer/**/*
      - package.json
      - pnpm-lock.yaml
    options:
      cache: false
  test-knowledge-integration:
    command: pnpm test:knowledge:integration
    inputs:
      - src-tauri/src/analysis/**/*
      - src-tauri/src/workspace/**/*
      - src-tauri/Cargo.toml
      - Cargo.toml
      - crates/**/*
      - Cargo.lock
    options:
      cache: false
  lint:
    deps:
      - ~:bindings-generate
    command: pnpm exec eslint .
    inputs:
      - src/**/*
      - scripts/**/*
      - eslint.config.ts
      - package.json
      - pnpm-lock.yaml
    options:
      cache: false
  lint-fix:
    deps:
      - ~:bindings-generate
    command: pnpm exec eslint . --fix
    options:
      cache: false
  quality-impact:
    command: pnpm quality:impact
    inputs:
      - docs/quality-gates.md
      - scripts/quality-impact.ts
      - src/quality/**/*
      - package.json
      - moon.yml
    options:
      cache: false
  quality-line-limits:
    command: pnpm quality:line-limits
    inputs:
      - src-tauri/src/**/*
      - e2e/**/*
      - scripts/**/*
      - src/**/*
      - package.json
    options:
      cache: false
  icons-generate:
    command: node --experimental-strip-types scripts/generate-app-icons.ts
    inputs:
      - scripts/generate-app-icons.ts
      - resources/icon-sources/*.svg
    outputs:
      - resources/icons/**/*
  prepare:
    deps:
      - ~:icons-generate
    inputs: []
    options:
      cache: false
  prepare-dev:
    deps:
      - ~:icons-generate
    inputs: []
    options:
      cache: false
  tauri-dev:
    command: node --experimental-strip-types scripts/dev-desktop.ts
    deps:
      - ~:prepare-dev
    options:
      cache: false
      persistent: true
  build:
    command: pnpm exec tauri build --no-bundle
    deps:
      - ~:prepare
    options:
      cache: false
  package:
    command: pnpm exec tauri bundle
    deps:
      - ~:build
    options:
      cache: false
  dist:
    deps:
      - ~:package
    options:
      cache: false
  dist-win:
    command: pnpm exec tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi
    deps:
      - ~:prepare
    options:
      cache: false
  dist-mac:
    command: pnpm exec tauri build --target aarch64-apple-darwin --bundles app,dmg
    deps:
      - ~:prepare
    options:
      cache: false
  dist-linux:
    command: pnpm exec tauri build --target x86_64-unknown-linux-gnu --bundles
      appimage,deb
    deps:
      - ~:prepare
    options:
      cache: false
  check:
    deps:
      - ~:quality-impact
      - ~:quality-line-limits
      - ~:lint
      - ~:typecheck
      - ~:test
    inputs: []
    options:
      cache: false
      runDepsInParallel: false
