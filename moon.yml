tasks:
  typecheck:
    script: pnpm exec tsc -b && pnpm exec tsc -p tsconfig.scripts.json
    inputs:
      - tsconfig*.json
      - src/**/*
      - electron/**/*
      - scripts/**/*
      - vite.config.ts
      - package.json
      - pnpm-lock.yaml
    options:
      cache: false

  test:
    command: pnpm exec vitest run
    inputs:
      - src/**/*
      - electron/**/*
      - vite.config.ts
      - package.json
      - pnpm-lock.yaml
    options:
      cache: false

  test-ui:
    command: pnpm exec playwright test
    options:
      cache: false

  test-electron:
    command: pnpm exec playwright test --config playwright.electron.config.ts
    options:
      cache: false

  test-knowledge-integration:
    command: pnpm exec vitest run electron/services/knowledgeEngine
    inputs:
      - electron/services/knowledgeEngine/**/*
      - electron/services/workspace/**/*
      - package.json
      - pnpm-lock.yaml
    options:
      cache: false

  lint:
    command: pnpm exec eslint .
    inputs:
      - src/**/*
      - electron/**/*
      - scripts/**/*
      - eslint.config.ts
      - package.json
      - pnpm-lock.yaml
    options:
      cache: false

  lint-fix:
    command: pnpm exec eslint . --fix
    options:
      cache: false

  quality-impact:
    command: pnpm quality:impact
    inputs:
      - docs/quality-gates.md
      - scripts/quality-impact.ts
      - src/quality/**/*
      - package.json
      - moon.yml
    options:
      cache: false

  icons-generate:
    command: node --experimental-strip-types scripts/generate-app-icons.ts
    inputs:
      - scripts/generate-app-icons.ts
      - src/assets/**/*
    outputs:
      - resources/icons/**/*

  prepare:
    deps:
      - ~:icons-generate
    inputs: []
    options:
      cache: false

  prepare-dev:
    deps:
      - ~:icons-generate
    inputs: []
    options:
      cache: false

  electron-dev:
    command: node --experimental-strip-types scripts/run-electron-dev.ts
    inputs:
      - scripts/run-electron-dev.ts
      - vite.config.ts
      - package.json
      - pnpm-lock.yaml
    deps:
      - ~:prepare-dev
    options:
      cache: false
      persistent: true

  electron-build:
    command: pnpm exec vite build --mode electron
    deps:
      - ~:prepare
    inputs:
      - src/**/*
      - electron/**/*
      - vite.config.ts
      - package.json
      - pnpm-lock.yaml
    outputs:
      - dist/**/*
      - dist-electron/**/*

  build:
    deps:
      - ~:typecheck
      - ~:electron-build
    inputs: []
    options:
      cache: false
      runDepsInParallel: false

  package:
    command: pnpm exec electron-builder --dir --publish never
    deps:
      - ~:build
    inputs:
      - package.json
      - pnpm-lock.yaml
      - dist/**/*
      - dist-electron/**/*
      - resources/icons/**/*
    outputs:
      - release/**/*
    options:
      cache: false

  dist:
    command: pnpm exec electron-builder --publish never
    deps:
      - ~:build
    inputs:
      - package.json
      - pnpm-lock.yaml
      - dist/**/*
      - dist-electron/**/*
      - resources/icons/**/*
    outputs:
      - release/**/*
    options:
      cache: false

  dist-win:
    command: pnpm exec electron-builder --win --publish never
    deps:
      - ~:build
    inputs:
      - package.json
      - pnpm-lock.yaml
      - dist/**/*
      - dist-electron/**/*
      - resources/icons/**/*
    outputs:
      - release/**/*
    options:
      cache: false

  dist-mac:
    command: pnpm exec electron-builder --mac --publish never
    deps:
      - ~:build
    inputs:
      - package.json
      - pnpm-lock.yaml
      - dist/**/*
      - dist-electron/**/*
      - resources/icons/**/*
    outputs:
      - release/**/*
    options:
      cache: false

  dist-linux:
    command: pnpm exec electron-builder --linux --publish never
    deps:
      - ~:build
    inputs:
      - package.json
      - pnpm-lock.yaml
      - dist/**/*
      - dist-electron/**/*
      - resources/icons/**/*
    outputs:
      - release/**/*
    options:
      cache: false

  check:
    deps:
      - ~:quality-impact
      - ~:lint
      - ~:typecheck
      - ~:test
    inputs: []
    options:
      cache: false
      runDepsInParallel: false
