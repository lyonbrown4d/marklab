tasks:
  typecheck:
    command: node node_modules/typescript/bin/tsc6 -b
    inputs:
      - tsconfig*.json
      - src/**/*
      - electron/**/*
      - scripts/**/*
      - '*.ts'
      - package.json
      - pnpm-lock.yaml
    options:
      cache: true

  test:
    command: pnpm test:coverage:critical
    inputs:
      - src/**/*
      - electron/**/*
      - vite.config.ts
      - package.json
      - pnpm-lock.yaml
    options:
      cache: false

  test-ui:
    command: pnpm exec playwright test
    options:
      cache: false

  test-electron:
    command: pnpm exec playwright test --config playwright.electron.config.ts
    options:
      cache: false

  test-performance-software:
    command: pnpm test:perf:software
    inputs:
      - e2e/performance/**/*
      - electron/**/*
      - src/**/*
      - playwright.performance.config.ts
      - package.json
      - pnpm-lock.yaml
    options:
      cache: false

  test-knowledge-integration:
    command: pnpm exec vitest run electron/services/knowledgeEngine
    inputs:
      - electron/services/knowledgeEngine/**/*
      - electron/services/workspace/**/*
      - package.json
      - pnpm-lock.yaml
    options:
      cache: false

  lint:
    command: pnpm exec eslint .
    inputs:
      - src/**/*
      - electron/**/*
      - scripts/**/*
      - eslint.config.ts
      - package.json
      - pnpm-lock.yaml
    options:
      cache: false

  lint-fix:
    command: pnpm exec eslint . --fix
    options:
      cache: false

  quality-impact:
    command: pnpm quality:impact
    inputs:
      - docs/quality-gates.md
      - scripts/quality-impact.ts
      - src/quality/**/*
      - package.json
      - moon.yml
    options:
      cache: false

  quality-line-limits:
    command: pnpm quality:line-limits
    inputs:
      - electron/**/*
      - src-tauri/src/**/*
      - e2e/**/*
      - scripts/**/*
      - src/**/*
      - package.json
    options:
      cache: false

  icons-generate:
    command: node --experimental-strip-types scripts/generate-app-icons.ts
    inputs:
      - scripts/generate-app-icons.ts
      - resources/icon-sources/*.svg
    outputs:
      - resources/icons/**/*

  prepare:
    deps:
      - ~:icons-generate
    inputs: []
    options:
      cache: false

  prepare-dev:
    deps:
      - ~:icons-generate
    inputs: []
    options:
      cache: false

  electron-dev:
    command: node --experimental-strip-types scripts/run-electron-dev.ts
    inputs:
      - scripts/run-electron-dev.ts
      - vite.config.ts
      - package.json
      - pnpm-lock.yaml
    deps:
      - ~:prepare-dev
    options:
      cache: false
      persistent: true

  electron-build:
    command: pnpm electron:build:artifacts
    deps:
      - ~:prepare
    inputs:
      - src/**/*
      - electron/**/*
      - public/**/*
      - index.html
      - splashscreen.html
      - scripts/build-electron.ts
      - vite*.ts
      - postcss.config.ts
      - tailwind.config.ts
      - tsconfig*.json
      - package.json
      - pnpm-lock.yaml
    outputs:
      - dist/**/*
      - dist-electron/**/*

  tauri-dev:
    command: pnpm exec tauri dev
    deps:
      - ~:prepare-dev
    options:
      cache: false
      persistent: true

  build:
    command: pnpm exec tauri build --no-bundle
    deps:
      - ~:prepare
    options:
      cache: false

  package:
    command: pnpm exec tauri bundle
    deps:
      - ~:build
    options:
      cache: false

  dist:
    deps:
      - ~:package
    options:
      cache: false

  dist-win:
    command: pnpm exec tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi
    deps:
      - ~:prepare
    options:
      cache: false

  dist-mac:
    command: pnpm exec tauri build --target aarch64-apple-darwin --bundles app,dmg
    deps:
      - ~:prepare
    options:
      cache: false

  dist-linux:
    command: pnpm exec tauri build --target x86_64-unknown-linux-gnu --bundles appimage,deb
    deps:
      - ~:prepare
    options:
      cache: false

  electron-release-build:
    deps:
      - ~:typecheck
      - ~:electron-build
    inputs: []
    options:
      cache: false
      runDepsInParallel: false

  electron-package:
    command: pnpm exec electron-builder --dir --publish never
    deps:
      - ~:electron-release-build
    inputs:
      - package.json
      - pnpm-lock.yaml
      - dist/**/*
      - dist-electron/**/*
      - resources/icons/**/*
    outputs:
      - release/**/*
    options:
      cache: false

  electron-dist:
    command: pnpm exec electron-builder --publish never
    deps:
      - ~:electron-release-build
    inputs:
      - package.json
      - pnpm-lock.yaml
      - dist/**/*
      - dist-electron/**/*
      - resources/icons/**/*
    outputs:
      - release/**/*
    options:
      cache: false

  electron-dist-win:
    command: pnpm exec electron-builder --win --publish never
    deps:
      - ~:electron-release-build
    inputs:
      - package.json
      - pnpm-lock.yaml
      - dist/**/*
      - dist-electron/**/*
      - resources/icons/**/*
    outputs:
      - release/**/*
    options:
      cache: false

  electron-dist-mac:
    command: pnpm exec electron-builder --mac --publish never
    deps:
      - ~:electron-release-build
    inputs:
      - package.json
      - pnpm-lock.yaml
      - dist/**/*
      - dist-electron/**/*
      - resources/icons/**/*
    outputs:
      - release/**/*
    options:
      cache: false

  electron-dist-linux:
    command: pnpm exec electron-builder --linux --publish never
    deps:
      - ~:electron-release-build
    inputs:
      - package.json
      - pnpm-lock.yaml
      - dist/**/*
      - dist-electron/**/*
      - resources/icons/**/*
    outputs:
      - release/**/*
    options:
      cache: false

  check:
    deps:
      - ~:quality-impact
      - ~:quality-line-limits
      - ~:lint
      - ~:typecheck
      - ~:test
    inputs: []
    options:
      cache: false
      runDepsInParallel: false
