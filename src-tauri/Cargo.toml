[package]
name = "marklab-desktop"
default-run = "marklab-desktop"
version = "0.2.8"
description = "Marklab desktop application"
authors = ["Marklab"]
edition = "2024"
rust-version = "1.99.1"

[lib]
name = "marklab_desktop"
crate-type = ["rlib"]

[features]
ipc-codegen = ["dep:specta-typescript", "tauri-specta/typescript"]
e2e-testing = ["dep:tauri-plugin-wdio-webdriver", "tauri/custom-protocol"]

[[bin]]
name = "generate-desktop-bindings"
path = "src/bin/generate_desktop_bindings.rs"
required-features = ["ipc-codegen"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["unstable"] }
tauri-plugin-cli = "2.5.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1"
# Keep the generator on tauri-specta's exact Specta release.
specta = { version = "=2.0.0-rc.26", features = ["derive", "function", "serde_json", "chrono", "uuid"] }
specta-typescript = { version = "=0.0.13", optional = true }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
lsp-types = "0.97"
thiserror = "2"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "json"] }
portable-pty = "0.9"
sha2 = "0.11.1"
hex = "0.4.3"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
notify = "8.2.0"
ignore = "0.4.33"
pulldown-cmark = "0.13.5"
regex = "1"
strsim = "0.11.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "form"] }
url = "2.5.8"
base64 = "0.23.1"
bytes = "1"
mime_guess = "2.0.5"
pathdiff = "0.2"
percent-encoding = "2"
git2 = { version = "0.21", features = ["vendored-libgit2", "vendored-openssl"] }
futures-util = "0.3"
fluxdi = { version = "=2.0.0", default-features = false, features = ["macros", "thread-safe", "async-factory"] }
moka = { version = "0.12.16", default-features = false, features = ["future", "sync"] }
deadpool = { version = "0.13.1", default-features = false, features = ["managed"] }
clipboard-rs = { version = "0.3.5", default-features = false, features = ["wayland"] }
cssparser = "0.38"
log = "0.4"
keyring = "4.2.0"
tempfile = "3.27.0"
quick-xml = { version = "0.42.0", features = ["serialize"] }
calamine = { version = "0.37.0", default-features = false }
csv = "1.4.0"
csv-core = "0.1.13"
ironcalc_base = { version = "0.9.1", default-features = false }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
typst = "0.15"
typst-layout = "0.15"
typst-pdf = "0.15"
typst-render = "0.15"
mitex = "0.2.4"
# Diagram parsers are opt-in since 0.9; retain the complete native language catalog.
merman-core = { version = "0.9.2", features = ["all-diagrams"] }
typst-as-lib = { version = "0.17.0", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
docx-rs = "0.4.22"
same-file = "1"
trash = "5"
unicode-normalization = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
scraper = "0.29"
ammonia = "4.2.4"
imagesize = "0.15"
layout-rs = "0.1.3"
rectangle-pack = { version = "0.4.2", default-features = false }
graphrs = { version = "0.12.0", default-features = false }
rmcp = { version = "3.7.0", default-features = false, features = ["server", "macros", "transport-io"] }
rig-core = { version = "=0.45.0", default-features = false }
rig-reqwest = { version = "=0.45.0", default-features = false, features = ["rustls"] }
tauri-plugin-window-state = "2"
puml = { version = "=0.2.6", default-features = false }
memchr = "2.8.3"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-macos-fps = "0.1.0"
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSData", "NSDictionary", "NSError", "NSString", "NSValue"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "WKWebView", "WKSnapshotConfiguration", "WKNavigation", "objc2-app-kit", "block2"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSImage", "NSBitmapImageRep", "NSImageRep", "NSEvent", "NSResponder", "NSView", "NSWindow", "NSButton", "NSControl", "block2"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationCategory", "UNNotificationAction", "UNNotificationTrigger"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Memory", "UI_Notifications", "Data_Xml_Dom", "Foundation", "Win32_UI_Notifications", "Win32_UI_Shell", "Win32_System_Registry", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Variant", "Win32_System_WinRT"] }

# Match the generated COM traits and implement macro used by windows 0.62.
windows-core = "0.62.2"

[target.'cfg(target_os = "linux")'.dependencies]
# tauri-plugin-deep-link 2.6.2 initializes ParseOption using its pre-0.21.2 fields.
rust-ini = "=0.21.1"
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }
# Match WebKitGTK/Tauri's binding family; native links cannot mix these releases.
gtk = "0.18.2"
cairo-rs = { version = "0.18.5", features = ["png"] }
zbus = { version = "6.1.0", default-features = false, features = ["tokio", "proxy"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[dev-dependencies]
rmcp = { version = "3.7.0", default-features = false, features = ["client"] }
tauri = { version = "2.12.5", features = ["test"] }
tempfile = "3.27.0"
