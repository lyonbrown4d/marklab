<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>marklab</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf9f7;
        --surface: #ffffff;
        --text: #2b2926;
        --muted: #77716a;
        --track: #e7e2dc;
        --accent: #786f62;
        --shadow: rgba(43, 41, 38, 0.1);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171717;
          --surface: #202020;
          --text: #f2f0ec;
          --muted: #aaa49c;
          --track: #35322f;
          --accent: #b5aa9d;
          --shadow: rgba(0, 0, 0, 0.22);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        font-family:
          Inter,
          'Segoe UI',
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: var(--text);
      }

      .splash {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px;
      }

      .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 12px;
      }

      .logo {
        width: 84px;
        height: 84px;
        filter: drop-shadow(0 18px 32px var(--shadow));
      }

      h1 {
        margin: 0;
        font-size: 23px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      p {
        margin: -4px 0 0;
        font-size: 12px;
        color: var(--muted);
      }

      .bar {
        width: 136px;
        height: 3px;
        margin-top: 4px;
        background: var(--track);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }

      .bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 38%;
        background: var(--accent);
        border-radius: inherit;
        animation: loading 1.15s ease-in-out infinite;
      }

      @keyframes loading {
        0% {
          transform: translateX(-100%);
        }
        50% {
          transform: translateX(120%);
        }
        100% {
          transform: translateX(260%);
        }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="brand">
        <picture>
          <source srcset="./marklab-dark.svg" media="(prefers-color-scheme: dark)" />
          <img class="logo" src="./marklab-light.svg" alt="marklab" />
        </picture>
        <h1>marklab</h1>
        <p>Opening workspace...</p>
        <div class="bar" aria-hidden="true"></div>
      </div>
    </div>
  </body>
</html>
