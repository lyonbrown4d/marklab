syntax = "proto3";

package knowledge.engine.v1;

service ControlService {
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}

service DocumentSessionService {
  rpc Sync(stream SyncRequest) returns (stream SyncResponse);
}

service MarkdownService {
  rpc GetDocumentSymbols(GetDocumentSymbolsRequest) returns (GetDocumentSymbolsResponse);
  rpc GetLinks(GetLinksRequest) returns (GetLinksResponse);
}

service WorkspaceVfsService {
  rpc GetSnapshot(GetWorkspaceFileSnapshotRequest) returns (GetWorkspaceFileSnapshotResponse);
  rpc ListEntries(ListWorkspaceEntriesRequest) returns (ListWorkspaceEntriesResponse);
  rpc ReadFile(ReadWorkspaceFileRequest) returns (ReadWorkspaceFileResponse);
  rpc WriteFile(WriteWorkspaceFileRequest) returns (WorkspacePathMutationResponse);
  rpc CreateFile(CreateWorkspaceFileRequest) returns (WorkspacePathMutationResponse);
  rpc CreateDirectory(CreateWorkspaceDirectoryRequest) returns (WorkspacePathMutationResponse);
  rpc RenamePath(RenameWorkspacePathRequest) returns (WorkspacePathMutationResponse);
  rpc DeletePath(DeleteWorkspacePathRequest) returns (WorkspacePathMutationResponse);
  rpc GetPathMetadata(GetWorkspacePathMetadataRequest) returns (GetWorkspacePathMetadataResponse);
}

service WorkspaceService {
  rpc OpenWorkspace(OpenWorkspaceRequest) returns (OpenWorkspaceResponse);
  rpc CloseWorkspace(CloseWorkspaceRequest) returns (CloseWorkspaceResponse);
  rpc GetWorkspaceStatus(GetWorkspaceStatusRequest) returns (GetWorkspaceStatusResponse);
  rpc HasDocuments(HasDocumentsRequest) returns (HasDocumentsResponse);
  rpc RebuildIndex(RebuildIndexRequest) returns (RebuildIndexResponse);
  rpc UpsertDocument(UpsertDocumentRequest) returns (UpsertDocumentResponse);
  rpc RemoveDocument(RemoveDocumentRequest) returns (RemoveDocumentResponse);
  rpc RemovePathPrefix(RemovePathPrefixRequest) returns (RemovePathPrefixResponse);
}

service SearchService {
  rpc Search(SearchRequest) returns (stream SearchResponse);
}

message GetCapabilitiesRequest {
  string workspace_instance_id = 1;
}

message GetCapabilitiesResponse {
  string protocol_version = 1;
  string engine_version = 2;
  repeated string capabilities = 3;
  StorageCapabilities storage = 4;
}

message StorageCapabilities {
  string metadata_store = 1;
  string search_index = 2;
  bool blob_store = 3;
}

message ShutdownRequest {
  string reason = 1;
}

message ShutdownResponse {
  bool accepted = 1;
}

message OpenWorkspaceRequest {
  string index_path = 1;
}

message OpenWorkspaceResponse {
  bool ok = 1;
  uint64 documents = 2;
}

message CloseWorkspaceRequest {}

message CloseWorkspaceResponse {
  bool ok = 1;
}

message GetWorkspaceStatusRequest {}

message GetWorkspaceStatusResponse {
  WorkspaceHealthStatus health = 1;
  WorkspaceIndexStatus index = 2;
  WorkspaceStorageStats storage = 3;
}

message WorkspaceHealthStatus {
  bool ok = 1;
  string state = 2;
  uint64 metadata_documents = 3;
  uint64 searchable_documents = 4;
  uint64 pending_outbox_events = 5;
  repeated string warnings = 6;
}

message WorkspaceIndexStatus {
  string search_index = 1;
  bool ready = 2;
  uint64 metadata_documents = 3;
  uint64 searchable_documents = 4;
  uint64 pending_outbox_events = 5;
}

message WorkspaceStorageStats {
  string metadata_store = 1;
  string search_index = 2;
  uint64 metadata_bytes = 3;
  uint64 search_index_bytes = 4;
  uint64 total_bytes = 5;
  uint64 metadata_documents = 6;
  uint64 pending_outbox_events = 7;
  bool blob_store = 8;
  uint64 blob_bytes = 9;
}

message GetWorkspaceFileSnapshotRequest {}

message GetWorkspaceFileSnapshotResponse {
  repeated WorkspaceFileEntry entries = 1;
}

message ListWorkspaceEntriesRequest {}

message ListWorkspaceEntriesResponse {
  repeated WorkspaceFileEntry entries = 1;
}

message WorkspaceFileEntry {
  string path = 1;
  string name = 2;
  WorkspaceFileEntryKind kind = 3;
}

enum WorkspaceFileEntryKind {
  WORKSPACE_FILE_ENTRY_KIND_UNSPECIFIED = 0;
  WORKSPACE_FILE_ENTRY_KIND_FILE = 1;
  WORKSPACE_FILE_ENTRY_KIND_FOLDER = 2;
}

message ReadWorkspaceFileRequest {
  string path = 1;
}

message ReadWorkspaceFileResponse {
  string content = 1;
}

message WriteWorkspaceFileRequest {
  string path = 1;
  string content = 2;
}

message CreateWorkspaceFileRequest {
  string path = 1;
}

message CreateWorkspaceDirectoryRequest {
  string path = 1;
}

message RenameWorkspacePathRequest {
  string from = 1;
  string to = 2;
}

message DeleteWorkspacePathRequest {
  string path = 1;
}

message WorkspacePathMutationResponse {
  bool ok = 1;
  WorkspaceFileEntryKind kind = 2;
  bool changed = 3;
}

message GetWorkspacePathMetadataRequest {
  string path = 1;
}

message GetWorkspacePathMetadataResponse {
  string path = 1;
  string absolute_path = 2;
  WorkspaceFileEntryKind kind = 3;
  uint64 size_bytes = 4;
  optional double modified_ms = 5;
  bool readonly = 6;
}

message HasDocumentsRequest {}

message HasDocumentsResponse {
  bool has_documents = 1;
}

message RebuildIndexRequest {
  repeated WorkspaceDocument documents = 1;
}

message RebuildIndexResponse {
  uint64 documents = 1;
}

message UpsertDocumentRequest {
  WorkspaceDocument document = 1;
}

message UpsertDocumentResponse {
  uint64 documents = 1;
}

message RemoveDocumentRequest {
  string path = 1;
}

message RemoveDocumentResponse {
  uint64 documents = 1;
}

message RemovePathPrefixRequest {
  string prefix = 1;
}

message RemovePathPrefixResponse {
  uint64 documents = 1;
}

message WorkspaceDocument {
  string path = 1;
  string title = 2;
  string content = 3;
}

message SyncRequest {
  string workspace_instance_id = 1;
  oneof event {
    OpenDocument open = 2;
    ApplyDocumentChange change = 3;
    CloseDocument close = 4;
    ResyncDocument resync = 5;
  }
}

message SyncResponse {
  oneof event {
    DocumentAcknowledged acknowledged = 1;
    DiagnosticsChanged diagnostics = 2;
    ResyncRequired resync_required = 3;
  }
}

message OpenDocument {
  string document_id = 1;
  string uri = 2;
  uint64 version = 3;
  string content = 4;
}

message ApplyDocumentChange {
  string document_id = 1;
  uint64 base_version = 2;
  uint64 version = 3;
  repeated TextEdit changes = 4;
}

message CloseDocument {
  string document_id = 1;
}

message ResyncDocument {
  string document_id = 1;
  uint64 version = 2;
  string content = 3;
}

message DocumentAcknowledged {
  string document_id = 1;
  uint64 version = 2;
}

message DiagnosticsChanged {
  string document_id = 1;
  uint64 version = 2;
  repeated Diagnostic diagnostics = 3;
}

message ResyncRequired {
  string document_id = 1;
  string reason = 2;
}

message Diagnostic {
  Range range = 1;
  string rule_id = 2;
  string message = 3;
  DiagnosticSeverity severity = 4;
}

enum DiagnosticSeverity {
  DIAGNOSTIC_SEVERITY_UNSPECIFIED = 0;
  DIAGNOSTIC_SEVERITY_ERROR = 1;
  DIAGNOSTIC_SEVERITY_WARNING = 2;
  DIAGNOSTIC_SEVERITY_INFORMATION = 3;
  DIAGNOSTIC_SEVERITY_HINT = 4;
}

message GetDocumentSymbolsRequest {
  string document_id = 1;
  uint64 document_version = 2;
}

message GetDocumentSymbolsResponse {
  repeated MarkdownDocumentSymbol symbols = 1;
}

message MarkdownDocumentSymbol {
  string name = 1;
  uint32 kind = 2;
  uint32 level = 3;
  string slug = 4;
  Range range = 5;
}

message GetLinksRequest {
  string document_id = 1;
  uint64 document_version = 2;
}

message GetLinksResponse {
  repeated MarkdownLink links = 1;
}

message MarkdownLink {
  string source_document_id = 1;
  string text = 2;
  string target = 3;
  Range range = 4;
  bool is_external = 5;
}

message SearchRequest {
  string query = 1;
  uint32 limit = 2;
  repeated string include_paths = 3;
  uint32 offset = 4;
  SearchOrder order = 5;
  bool include_total_hits = 6;
  bool include_diagnostics = 7;
}

message SearchResponse {
  repeated SearchResult results = 1;
  bool done = 2;
  uint32 total_hits = 3;
  SearchDiagnostics diagnostics = 4;
}

message SearchDiagnostics {
  uint64 elapsed_ms = 1;
  uint32 returned_hits = 2;
  uint32 total_hits = 3;
  uint32 offset = 4;
  uint32 limit = 5;
}

enum SearchOrder {
  SEARCH_ORDER_SCORE = 0;
  SEARCH_ORDER_PATH = 1;
  SEARCH_ORDER_TITLE = 2;
  SEARCH_ORDER_PATH_THEN_SCORE = 3;
}
message SearchResult {
  string document_id = 1;
  string path = 2;
  string title = 3;
  uint32 line = 4;
  uint32 column = 5;
  uint32 end_column = 6;
  string snippet = 7;
  repeated SearchHighlight snippet_highlights = 8;
  float score = 9;
}

message SearchHighlight {
  uint32 start = 1;
  uint32 end = 2;
}

message TextEdit {
  Range range = 1;
  string text = 2;
}

message Range {
  Position start = 1;
  Position end = 2;
}

message Position {
  uint32 line = 1;
  uint32 character = 2;
}


