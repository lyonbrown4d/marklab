[tools]
node = "24.15.0"
pnpm = "12.11.2"

[env]
MISE_NODE_COREPACK = "true"

[tasks.dev]
description = "Run the Tauri desktop development workflow."
run = "pnpm exec moon run desktop:tauri-dev"

[tasks.build]
description = "Build the Tauri desktop application without bundling."
run = "pnpm exec moon run desktop:build"

[tasks.package]
description = "Build and bundle the Tauri application for the current host."
run = "pnpm exec moon run desktop:package"

[tasks.dist]
description = "Create distributable Tauri artifacts for the current host."
run = "pnpm exec moon run desktop:dist"

[tasks.check]
description = "Run lint, typecheck, tests, and builds."
run = "pnpm exec moon run desktop:check"

[tasks.typecheck]
description = "Run TypeScript type checking."
run = "pnpm exec moon run desktop:typecheck"

[tasks.test]
description = "Run unit tests."
run = "pnpm exec moon run desktop:test"

[tasks.knowledge-test]
description = "Run the Rust analysis library integration tests."
run = "pnpm exec moon run desktop:test-knowledge-integration"
