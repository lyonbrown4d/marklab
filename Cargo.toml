[workspace]
members = [
  "knowledge-engine/bins/knowledge-engine",
  "knowledge-engine/crates/engine-core",
  "knowledge-engine/crates/grpc-api",
  "knowledge-engine/crates/workspace-vfs",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
figment2 = { version = "0.11.5", default-features = false, features = ["env"] }
fluxdi = { version = "1.2.2", default-features = false, features = ["debug", "thread-safe", "async-factory", "lifecycle", "tracing"] }
camino = "1"
dashmap = "6.2.1"
ignore = "0.4"
moka = { version = "0.12.15", features = ["sync"] }
path-clean = "1"
prost = "0.14"
protoc-bin-vendored = "3"
pulldown-cmark = "0.13.4"
rayon = "1.12.0"
ropey = "1.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "signal", "fs"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
tree-sitter = "0.26.9"
tree-sitter-md = "0.5.3"
unicode-normalization = "0.1"
unicode-segmentation = "1"
