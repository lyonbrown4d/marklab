name: Native Rust Checks

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NODE_VERSION: '24'
  PNPM_VERSION: '12.15.0'
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_BACKTRACE: '1'

jobs:
  native:
    name: Native Rust (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: macOS ARM
            os: macos-latest
            target: aarch64-apple-darwin
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require native Apple Silicon runner
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libxdo-dev libssl-dev libnss3 libasound2t64 libgbm1 libxcomposite1 libxdamage1 libxrandr2 libxss1 libxtst6 librsvg2-dev patchelf xdg-utils
      - name: Enable Chromium sandbox namespaces on the Linux test runner
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install CEF macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - name: Configure shared CEF cache for Cargo and Tauri
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            printf 'CEF_PATH=%s/Library/Caches/tauri-cef\n' "$HOME" >> "$GITHUB_ENV"
          else
            printf 'CEF_PATH=%s/.cache/tauri-cef\n' "$HOME" >> "$GITHUB_ENV"
          fi
      - name: Cache CEF distribution
        if: runner.os != 'Windows'
        uses: actions/cache@v5
        with:
          path: ${{ env.CEF_PATH }}
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: ${{ matrix.target }}
          components: rustfmt,clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> src-tauri/target'
      - run: pnpm install --frozen-lockfile
      - name: Generate native build resources
        run: pnpm icons:generate
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Check all native Rust targets
        run: cargo clippy --workspace --target ${{ matrix.target }} --all-targets --locked -- -D warnings
      - name: Run native library tests without a GUI event loop
        run: cargo test --workspace --target ${{ matrix.target }} --locked
