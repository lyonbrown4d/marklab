name: Standalone CLI

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
    tags: ['cli-v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  cli:
    name: CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: '12.15.0'
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: ${{ matrix.target }}
          components: rustfmt,clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> src-tauri/target'
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: cargo clippy -p marklab-document -p marklab-cli --all-targets --locked -- -D warnings
      - run: node --experimental-strip-types scripts/cli.ts test ${{ matrix.target }}
      - name: Verify crates.io packages without uploading
        if: matrix.os == 'ubuntu-22.04'
        run: pnpm cli:publish:check
      - run: node --experimental-strip-types scripts/cli.ts package ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: marklab-cli-${{ matrix.target }}
          path: dist/cli/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/cli-v')
    needs: cli
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: marklab-cli-*
          merge-multiple: true
          path: artifacts
      - name: Create or update CLI draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CLI_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$CLI_TAG" >/dev/null 2>&1; then
            gh release create "$CLI_TAG" --verify-tag --draft --title "Marklab CLI $CLI_TAG" --notes "Standalone Rust CLI. Review platform artifacts before publishing."
          fi
          test "$(gh release view "$CLI_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$CLI_TAG" artifacts/* --clobber
