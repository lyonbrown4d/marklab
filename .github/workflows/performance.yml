name: Plate Performance Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plate-performance-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NODE_VERSION: '24'
  PNPM_VERSION: '10.26.0'

jobs:
  software-rendering:
    name: Plate performance (software rendering)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run software-rendering performance gate
        run: xvfb-run --auto-servernum pnpm test:perf:ci

      - name: Upload performance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: plate-performance-software-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            test-results/electron-performance/
            playwright-report/performance/
