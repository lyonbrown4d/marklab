name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag. Defaults to app-v<package.json version>.'
        required: false
        type: string
  push:
    tags:
      - 'app-v*'

permissions:
  contents: read

concurrency:
  group: release-desktop
  cancel-in-progress: false

env:
  CI: 'true'
  NODE_VERSION: '24'
  PNPM_VERSION: '12.11.2'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate repository, versions, and tag
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: node --experimental-strip-types scripts/prepare-tauri-release.ts validate
      - name: Project check (including existing 85 percent coverage gates)
        run: pnpm check
      - name: Run retained Electron release regressions
        run: xvfb-run --auto-servernum pnpm test:electron:release
      - name: Upload Electron baseline regression evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: electron-release-regressions
          if-no-files-found: warn
          retention-days: 14
          path: |
            output/playwright/electron/
            playwright-report/

  build:
    name: Build Tauri ${{ matrix.name }}
    needs: validate
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - name: macos
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux native dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt,clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: pnpm install --frozen-lockfile
      - name: Prepare public updater configuration and require signing credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_PLATFORM: ${{ matrix.name }}
          TAURI_RELEASE_CONFIG: ${{ runner.temp }}/marklab-release.json
          REQUESTED_TAG: ${{ needs.validate.outputs.tag }}
        run: node --experimental-strip-types scripts/prepare-tauri-release.ts configure
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Generate application icons before compiling native targets
        run: pnpm icons:generate
      - name: Check Rust targets and tests without executing them
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Build and upload signed updater artifacts to draft release
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm exec tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "${{ runner.temp }}/marklab-release.json"
          tagName: ${{ needs.validate.outputs.tag }}
          releaseName: Marklab ${{ needs.validate.outputs.tag }}
          releaseBody: 'Tauri desktop artifacts. Review all three platform builds and acceptance evidence before publishing this draft.'
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadWorkflowArtifacts: true
      - name: Verify macOS code signature
        if: matrix.name == 'macos'
        run: codesign --verify --deep --strict --verbose=2 src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Marklab.app
