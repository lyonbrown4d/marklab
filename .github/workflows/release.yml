name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag. Defaults to app-v<package.json version>.'
        required: false
        type: string
  push:
    tags:
      - 'app-v*'

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.26.0'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc -b --pretty false

      - name: Lint
        run: pnpm exec eslint .

      - name: Test
        run: pnpm test

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            command: pnpm build:desktop && pnpm exec electron-builder --linux --publish never -c.publish.provider=github -c.publish.owner=${{ github.repository_owner }} -c.publish.repo=${{ github.event.repository.name }} -c.publish.tagNamePrefix=app-v
          - name: macos
            os: macos-latest
            command: pnpm build:desktop && pnpm exec electron-builder --mac --publish never -c.publish.provider=github -c.publish.owner=${{ github.repository_owner }} -c.publish.repo=${{ github.event.repository.name }} -c.publish.tagNamePrefix=app-v
          - name: windows
            os: windows-latest
            command: pnpm build:desktop && pnpm exec electron-builder --win --publish never -c.publish.provider=github -c.publish.owner=${{ github.repository_owner }} -c.publish.repo=${{ github.event.repository.name }} -c.publish.tagNamePrefix=app-v
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux packaging dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron bundles
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: marklab-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.exe
            release/*.tar.gz
            release/*.zip
            release/*.blockmap
            release/*.yml
            !release/builder-debug.yml

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            release_tag="${GITHUB_REF_NAME}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            release_tag="${{ github.event.inputs.tag }}"
          else
            version="$(node -p "require('./package.json').version")"
            release_tag="app-v${version}"
          fi

          if [ -z "$release_tag" ]; then
            echo "Unable to resolve release tag." >&2
            exit 1
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Create or reuse release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id')"
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "marklab $RELEASE_TAG" \
              --notes "Automated desktop release. Installers are attached below."
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -F draft=false \
              >/dev/null
            exit 0
          fi

          create_args=(
            "$RELEASE_TAG"
            --repo "$GITHUB_REPOSITORY"
            --title "marklab $RELEASE_TAG"
            --notes "Automated desktop release. Installers are attached below."
          )

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            create_args+=(--verify-tag)
          else
            create_args+=(--target "$GITHUB_SHA")
          fi

          gh release create "${create_args[@]}"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        shell: bash
        run: |
          mapfile -t assets < <(
            find downloaded-artifacts -type f \
              ! -name 'builder-debug.yml' \
              \( -name '*.AppImage' \
              -o -name '*.deb' \
              -o -name '*.dmg' \
              -o -name '*.exe' \
              -o -name '*.tar.gz' \
              -o -name '*.zip' \
              -o -name '*.blockmap' \
              -o -name '*.yml' \) \
              | sort
          )

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found." >&2
            exit 1
          fi

          gh release upload "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
